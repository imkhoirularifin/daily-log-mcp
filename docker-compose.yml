services:
  daily-log-mcp:
    build: .
    image: daily-log-mcp:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DAILY_LOG_MCP_KEY_ARIFIN: ${DAILY_LOG_MCP_KEY_ARIFIN:-}
      DAILY_LOG_MCP_KEY_DORI: ${DAILY_LOG_MCP_KEY_DORI:-}
      DAILY_LOG_MCP_KEY_DOCUMIND_DEVOPS: ${DAILY_LOG_MCP_KEY_DOCUMIND_DEVOPS:-}
      MCP_BOOTSTRAP_KEYS: ${MCP_BOOTSTRAP_KEYS:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      DATABASE_PATH: /data/daily-log.db
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      - daily-log-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  daily-log-data:
